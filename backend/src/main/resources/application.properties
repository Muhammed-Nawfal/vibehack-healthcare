spring.application.name=backend

# Load local, git-ignored secrets if present (backend/config/local.properties).
# "optional:" means the app still starts if the file is missing.
spring.config.import=optional:file:./config/local.properties

# z.ai (GLM) credentials. Resolution order (highest wins):
#   1. backend/config/local.properties  (recommended for local dev)
#   2. ZAI_API_KEY / ZAI_MODEL environment variables
# Never hard-code the real key in this committed file.
zai.api-key=${ZAI_API_KEY:}
zai.model=${ZAI_MODEL:glm-5.1}

# Comma-separated allowed frontend origins/patterns.
# Localhost is the dev default; set CORS_ALLOWED_ORIGIN_PATTERNS for deploy.
# Example: CORS_ALLOWED_ORIGIN_PATTERNS=https://mira.example.com
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
